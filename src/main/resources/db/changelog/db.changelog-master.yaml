databaseChangeLog:
  - changeSet:
      id: create-event-category-table
      author: you
      changes:
        - createTable:
            tableName: event_category
            columns:
              - column:
                  name: category_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: category_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: category_theme
                  type: VARCHAR(255)

  - changeSet:
      id: create-event-table
      author: you
      changes:
        - createTable:
            tableName: event
            columns:
              - column:
                  name: event_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: start_date_time
                  type: TIMESTAMP
              - column:
                  name: end_date_time
                  type: TIMESTAMP
              - column:
                  name: location
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: created_on
                  type: TIMESTAMP
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: event
            baseColumnNames: category_id
            referencedTableName: event_category
            referencedColumnNames: category_id
            constraintName: fk_event_category
